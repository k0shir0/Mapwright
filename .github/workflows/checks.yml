name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/setup_agent.py --client codex --home "${{ runner.temp }}/mapwright-home" --workspace "${{ runner.temp }}/mapwright-workspace" --native off --yes
      - run: python -m pip install -e ".[mcp,source,desktop,dev]"
      - run: python -m pip check
      - run: python -m compileall -q cli_anything scripts tests
      - run: python -m black --check cli_anything scripts tests
      - if: runner.os == 'Windows'
        run: python -c "import win32api, win32job, PIL, frida; from cli_anything.hammerplusplus import desktop, windows"
      - run: python -m unittest discover -s tests -v
        env:
          CLI_ANYTHING_FORCE_INSTALLED: '1'
      - run: python scripts/demo.py
