[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mapwright"
version = "0.2.0"
description = "Mapwright CLI and MCP tools for legacy CS:GO mapping in Hammer++"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/k0shir0/Mapwright"

[tool.black]
target-version = ["py311"]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
source = ["srctools>=2.7,<3"]
desktop = ["pywin32>=306; sys_platform == 'win32'", "Pillow>=10; sys_platform == 'win32'", "frida>=17.23.2,<18; sys_platform == 'win32'"]
dev = ["black==26.3.1", "PyYAML==6.0.3"]

[project.scripts]
mapwright = "cli.hammerplusplus.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["cli", "cli.*"]
namespaces = true
